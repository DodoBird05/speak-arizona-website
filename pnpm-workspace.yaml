# pnpm blocks dependency install scripts by default. These two are native
# packages that fetch or compile a platform binary. Neither is needed at
# runtime here, so their scripts stay blocked:
#   sharp         — libvips image binary, pulled in by next.
#   unrs-resolver — native resolver behind eslint-import-resolver-typescript.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Force patched in-major versions of dev/build-time transitive deps to clear
# pnpm audit CVEs (eslint toolchain, gray-matter's js-yaml, @tailwindcss/postcss's
# postcss). All same-major bumps, no API breaks.
#
# These MUST live here, not in package.json under "pnpm.overrides". pnpm 11
# stopped reading that field and ignores it silently — the failure mode is an
# audit that looks clean while every pin is dead. pnpm 10 reads this file too,
# so this location is the correct one on both versions.
#
# This repo has no `packageManager` pin, so it follows whatever pnpm is on PATH
# (10.15.0 as of 2026-09-01). That is exactly why the pins cannot sit in
# package.json: a future bump to pnpm 11 would silently disarm them.
overrides:
  minimatch@3: 3.1.5
  flatted: 3.4.2
  ajv@6: 6.15.0
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  # GHSA-5p4m-2wfm-xmqj covers BOTH lines — <3.15.1 and >=4.0.0 <4.3.1.
  # One advisory, two ranges; pin each major to its own patched floor.
  js-yaml@3: 3.15.1
  js-yaml@4: 4.3.1
  '@babel/core': 7.29.7
  postcss@8: 8.5.25
  # postcss's own nanoid dep; GHSA-2v37-7h3g-55p8, patched in 3.3.18.
  nanoid@3: 3.3.18
  # Reaches browserslist via @babel/core's helper-compilation-targets.
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g, both published 2026-09-01,
  # both patched in 4.28.7; 4.28.8 is the current 4.28 patch. Build-time only.
  browserslist@4: 4.28.8
